<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UI — Download ZIP smoke test</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:20px}</style>
  <script src="/node_modules/jszip/dist/jszip.min.js"></script>
</head>
<body>
  <h1>UI — Download ZIP smoke test</h1>
  <div id="out"></div>

  <!-- Minimal DOM hooks used by src/ui.js -->
  <div id="dropzone"></div>
  <button id="importButton" type="button">Browse</button>
  <input id="fileInput" type="file" title="Import files" />
  <button id="downloadZip" type="button" disabled>Download ZIP</button>
  <div class="convert-button-wrapper" tabindex="0">
    <button id="convertButton" type="button">Convert</button>
    <div id="convertTooltip" role="tooltip" class="hidden" aria-hidden="true"></div>
  </div>
  <div id="fileList"></div>
  <div id="statusPanel" class="hidden"></div>
  <span id="appStateBadge">Empty</span>
  <div id="autoConvertNotice" class="hidden"></div>
  <div id="diagnosticsPanel" class="hidden"><span id="diagnosticsCount"></span><div id="diagnosticsList"></div></div>
  <button id="helpButton" type="button" aria-expanded="false">Help</button>
  <div id="helpModal" class="hidden"><button id="helpCloseButton" type="button">Close</button></div>

  <!-- Advanced options (minimal hooks) -->
  <input id="autoConvertEnabled" type="checkbox" title="Auto convert" checked />
  <select id="conversionProfile" title="Conversion profile"><option value="onenote">OneNote</option></select>
  <input id="externalizeCssEnabled" type="checkbox" title="Externalize CSS" />
  <select id="externalizeCssMode" title="Externalize CSS mode"><option value="shared">Shared stylesheet for all converted pages</option><option value="per-page">One stylesheet per converted page</option></select>
  <input id="experimentalExportEnabled" type="checkbox" title="Experimental export" />
  <select id="exportFormat" title="Export format"><option value="html">HTML (.html)</option><option value="markdown">Markdown (.md)</option></select>
  <p id="exportFormatHelp"></p>
  <div id="markdownFlavorContainer" class="hidden"><select id="markdownFlavor" title="Markdown flavor"><option value="obsidian">Obsidian-compatible</option></select></div>
  <input id="convertedPageThemeToggleEnabled" type="checkbox" title="Converted page theme toggle" />
  <input id="convertedPageThemeToggleOledBlack" type="checkbox" title="OLED black mode" />
  <p id="convertedPageThemeHelp"></p>
  <input id="toolbarEnabled" type="checkbox" title="Toolbar enabled" />

  <script type="module">
    function pass(msg) { const o = document.getElementById('out'); o.innerHTML += `<div style="color:green">PASS: ${msg}</div>`; }
    function fail(msg) { const o = document.getElementById('out'); o.innerHTML += `<div style="color:red">FAIL: ${msg}</div>`; }

    async function main() {
      const { initUI, state, renderFileList } = await import('../src/ui.js');

      // Stub JSZip so we can detect ZIP generation without performing a download
      window.__test_generateAsync_called = false;
      window.__test_zip_files = [];
      window.__test_zip_contents = {};
      window.__test_zip_readme = '';
      window.__lastDownloadHtml = '';
      window.JSZip = function () {
        this._files = {};
        this.file = (name, content) => { this._files[name] = content; return this; };
        this.generateAsync = () => {
          window.__test_generateAsync_called = true;
          window.__test_zip_files = Object.keys(this._files);
          window.__test_zip_contents = { ...this._files };
          window.__test_zip_readme = String(this._files['README.txt'] || '');
          return Promise.resolve(new Blob([]));
        };
      };

      const realFetch = window.fetch ? window.fetch.bind(window) : null;
      window.fetch = async (input, init) => {
        const url = String(typeof input === 'string' ? input : (input && input.url) || '');
        if (/assets\/tailwind-output\.css$/i.test(url)) {
          return {
            ok: true,
            status: 200,
            async text() {
              return 'body { background: #fff; } .onc-copy { color: #111; }';
            }
          };
        }
        if (realFetch) return realFetch(input, init);
        throw new Error(`Unexpected fetch in test: ${url}`);
      };

      initUI();

      // Simulate a successfully converted file with outputHtml
      const entry = {
        id: 't-1',
        name: '123e4567-e89b-12d3-a456-426614174000.mht',
        size: 1024,
        status: 'success',
        outputHtml: '<!doctype html><html><head><title>Readable Export Name</title><link rel="stylesheet" href="assets/tailwind-output.css"></head><body><main><h1>Readable Export Name</h1><p>ok</p></main></body></html>',
        conversionConfig: { ExternalizeCssEnabled: false },
        outputAssets: []
      };
      const entryWithSidecar = {
        id: 't-2',
        name: '36f1cb41-5f18-4fd7-8f52-6dca6af3a9b1.mht',
        size: 1024,
        status: 'success',
        outputHtml: '<!doctype html><html><head><title>Styled Export Name</title><link rel="stylesheet" href="assets/tailwind-output.css"></head><body><main><h1>Styled Export Name</h1><p>styled</p></main></body></html>',
        conversionConfig: { ExternalizeCssEnabled: true, ExternalizeCssMode: 'shared' },
        outputAssets: [{ type: 'text/css', content: '.demo{color:red}', filename: 'converted-shared.css' }]
      };
      const entryMissingSidecar = {
        id: 't-3',
        name: '4b52b50a-b2a4-4cab-9602-5c4c7cf6b9ee.mht',
        size: 1024,
        status: 'success',
        outputHtml: '<!doctype html><html><head><title>Fallback Export Name</title><link rel="stylesheet" href="assets/tailwind-output.css"></head><body><main><h1>Fallback Export Name</h1><p>fallback</p></main></body></html>',
        conversionConfig: { ExternalizeCssEnabled: true, ExternalizeCssMode: 'shared' },
        outputAssets: []
      };
      const deferredEntry = {
        id: 't-4',
        name: 'deferred-export-demo.mht',
        size: 1024,
        status: 'success',
        outputHtml: '<!doctype html><html><head><title>Deferred Export Demo</title><style id="onc-toolbar-style"></style><script id="onc-toolbar-script"><\/script><style id="onc-converted-theme-style"></style><script id="onc-converted-theme-script"><\/script><script data-onc-export-styles-loader="v1">!function(d,h,l){l=d.createElement(\'link\');l.rel=\'stylesheet\';l.href=\'styles.css\';l.onload=function(){h.className+=\' enhanced\'};(d.head||h).appendChild(l)}(document,document.documentElement)<\/script></head><body><main><h1>Deferred Export Demo</h1><p>deferred</p></main><button type="button" id="onc-converted-theme-toggle">🔆</button><button type="button" id="onc-toolbar-show">Toolbar</button></body></html>',
        conversionConfig: { ExternalizeCssEnabled: false, ExportStylesMode: 'deferred' },
        outputAssets: []
      };
      state.queue.push(entry, entryWithSidecar, entryMissingSidecar, deferredEntry);
      renderFileList();

      const perFileBtn = document.querySelector('[data-download-id="t-1"]');
      if (perFileBtn) pass('Per-file Download button rendered'); else fail('Per-file Download button not rendered');

      const sidecarBlockedBtn = document.querySelector('[data-download-id="t-2"]');
      if (!sidecarBlockedBtn) pass('Per-file download blocked when CSS sidecar exists');
      else fail('Per-file download should be blocked when CSS sidecar exists');

      const realCreate = Document.prototype.createElement;
      const realCreateObjectURL = URL.createObjectURL.bind(URL);
      const realRevokeObjectURL = URL.revokeObjectURL.bind(URL);
      Document.prototype.createElement = function(tag) {
        const el = realCreate.call(this, tag);
        if (tag.toLowerCase() === 'a') window.__lastAnchor = el;
        return el;
      };
      URL.createObjectURL = function(blob) {
        const type = String((blob && blob.type) || '');
        if (/text\/html/i.test(type) && blob && typeof blob.text === 'function') {
          blob.text().then((text) => {
            window.__lastDownloadHtml = text;
          });
        }
        return realCreateObjectURL(blob);
      };
      URL.revokeObjectURL = function(url) {
        return realRevokeObjectURL(url);
      };

      perFileBtn.click();
      setTimeout(() => {
        if (window.__lastAnchor && window.__lastAnchor.download === 'Readable Export Name.html') {
          pass('Per-file download attempted with title-derived filename');
        } else {
          fail('Per-file download did not create expected anchor');
        }

        if (/data-onc-inline-stylesheet="assets\/tailwind-output\.css"/i.test(window.__lastDownloadHtml) && !/<link[^>]+href="assets\/tailwind-output\.css"/i.test(window.__lastDownloadHtml)) {
          pass('Per-file download inlines bundled stylesheet for standalone HTML');
        } else {
          fail('Per-file download did not inline bundled stylesheet for standalone HTML');
        }

        const zipBtn = document.getElementById('downloadZip');
        if (!zipBtn.disabled) {
          pass('Download ZIP button enabled');
        } else {
          fail('Download ZIP button still disabled');
        }

        zipBtn.click();

        setTimeout(() => {
          if (window.__test_generateAsync_called) pass('ZIP generation invoked (JSZip.generateAsync called)');
          else fail('ZIP generation was not invoked');

          if (window.__test_zip_files.includes('Readable Export Name.html') && window.__test_zip_files.includes('Styled Export Name.html')) {
            pass('ZIP uses title-derived page filenames');
          } else {
            fail('ZIP missing expected title-derived page filenames');
          }

          if (window.__test_zip_files.some((name) => name === 'converted-shared.css')) {
            pass('ZIP includes externalized CSS sidecar asset');
          } else {
            fail('ZIP missing expected CSS sidecar asset');
          }

          if (!window.__test_zip_files.some((name) => name === 'styles.css')) {
            pass('ZIP omits deferred export enhancement stylesheet');
          } else {
            fail('ZIP should not include deferred export enhancement stylesheet');
          }

          if (!window.__test_zip_files.some((name) => name === 'assets/tailwind-output.css')) {
            pass('ZIP avoids extra bundled stylesheet file in shared mode');
          } else {
            fail('ZIP should not emit a separate bundled stylesheet file in shared mode');
          }

          const readableZipHtml = String(window.__test_zip_contents['Readable Export Name.html'] || '');
          const styledZipHtml = String(window.__test_zip_contents['Styled Export Name.html'] || '');
          const deferredZipHtml = String(window.__test_zip_contents['deferred-export-demo.html'] || '');
          if (!/<link[^>]+href="assets\/tailwind-output\.css"/i.test(styledZipHtml) && /<link[^>]+href="converted-shared\.css"/i.test(styledZipHtml) && !/data-onc-inline-stylesheet="assets\/tailwind-output\.css"/i.test(styledZipHtml)) {
            pass('ZIP uses only converted-shared.css for shared externalized HTML pages');
          } else {
            fail('ZIP did not collapse shared externalized HTML pages to one stylesheet link');
          }

          if (/data-onc-inline-stylesheet="assets\/tailwind-output\.css"/i.test(readableZipHtml) && !/<link[^>]+href="assets\/tailwind-output\.css"/i.test(readableZipHtml)) {
            pass('ZIP still inlines bundled stylesheet for non-externalized HTML pages');
          } else {
            fail('ZIP did not inline bundled stylesheet for non-externalized HTML pages');
          }

          if (/data-onc-export-styles-loader="v1"/i.test(deferredZipHtml) && /id="onc-toolbar-script"/i.test(deferredZipHtml) && /id="onc-converted-theme-script"/i.test(deferredZipHtml) && !/enhancements\.js/i.test(deferredZipHtml) && !/data-onc-inline-stylesheet="styles\.css"/i.test(deferredZipHtml) && !/<link[^>]+href="styles\.css"/i.test(deferredZipHtml)) {
            pass('ZIP keeps deferred export HTML self-contained without packaging styles.css');
          } else {
            fail('ZIP did not preserve deferred export HTML contract');
          }

          if (window.__test_zip_files.includes('README.txt') && /Falling back to HTML output as-is/i.test(window.__test_zip_readme)) {
            pass('ZIP includes fallback README warning for missing sidecar');
          } else {
            fail('ZIP missing fallback README warning');
          }

          Document.prototype.createElement = realCreate;
          URL.createObjectURL = realCreateObjectURL;
          URL.revokeObjectURL = realRevokeObjectURL;
        }, 200);
      }, 50);
    }

    main().catch((err) => {
      fail(`Smoke bootstrap failed: ${err && err.stack ? err.stack : err}`);
    });
  </script>
</body>
</html>
