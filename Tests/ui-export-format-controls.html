<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>UI — Export format controls smoke test</title>
  <style>body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;padding:20px}.hidden{display:none}</style>
</head>
<body>
  <h1>UI — Export format controls smoke test</h1>
  <div id="out"></div>

  <div id="dropzone" tabindex="0"></div>
  <button id="importButton" type="button">Import</button>
  <input id="fileInput" type="file" title="Import files" />
  <div id="fileList"></div>
  <div id="statusPanel" class="hidden"></div>
  <span id="appStateBadge">Empty</span>
  <button id="downloadZip" type="button" disabled>Download ZIP</button>
  <div class="convert-button-wrapper" tabindex="0"><button id="convertButton" type="button" disabled>Convert</button></div>
  <div id="convertTooltip" class="hidden" aria-hidden="true"></div>

  <input id="toolbarEnabled" type="checkbox" title="Toolbar enabled" />
  <input id="autoConvertEnabled" type="checkbox" checked title="Auto convert enabled" />
  <input id="externalizeCssEnabled" type="checkbox" title="Externalize CSS enabled" />
  <select id="externalizeCssMode" title="Externalize CSS mode"><option value="shared">shared</option></select>
  <p id="autoConvertNotice"></p>

  <input id="experimentalExportEnabled" type="checkbox" title="Experimental export enabled" />
  <select id="exportFormat" class="hidden" disabled>
    <option value="html" selected>HTML</option>
    <option value="markdown">Markdown</option>
  </select>
  <div id="markdownFlavorContainer" class="hidden">
    <select id="markdownFlavor" disabled>
      <option value="obsidian" selected>Obsidian</option>
      <option value="commonmark">CommonMark</option>
      <option value="gfm">GFM</option>
      <option value="markdown-extra">Markdown Extra</option>
    </select>
  </div>
  <p id="exportFormatHelp"></p>

  <input id="convertedPageThemeToggleEnabled" type="checkbox" title="Converted page theme toggle enabled" />
  <input id="convertedPageThemeToggleOledBlack" type="checkbox" disabled title="Converted page OLED black enabled" />
  <p id="convertedPageThemeHelp"></p>

  <details id="diagnosticsPanel" class="hidden"></details>
  <ul id="diagnosticsList"></ul>
  <span id="diagnosticsCount"></span>

  <button id="helpButton" type="button" title="Help">Help</button>
  <div id="helpModal" class="hidden"></div>
  <button id="helpCloseButton" type="button" title="Close help">Close</button>

  <script type="module">
    import { initUI } from '../src/ui.js';

    function pass(msg) { const o = document.getElementById('out'); o.innerHTML += `<div style="color:green">PASS: ${msg}</div>`; }
    function fail(msg) { const o = document.getElementById('out'); o.innerHTML += `<div style="color:red">FAIL: ${msg}</div>`; }

    initUI();

    const experimental = document.getElementById('experimentalExportEnabled');
    const exportFormat = document.getElementById('exportFormat');
    const flavorContainer = document.getElementById('markdownFlavorContainer');
    const flavor = document.getElementById('markdownFlavor');
    const help = document.getElementById('exportFormatHelp');
    const convertedThemeToggle = document.getElementById('convertedPageThemeToggleEnabled');
    const convertedThemeOled = document.getElementById('convertedPageThemeToggleOledBlack');
    const convertedThemeHelp = document.getElementById('convertedPageThemeHelp');

    if (exportFormat.disabled && exportFormat.classList.contains('hidden')) pass('Export format hidden/disabled by default');
    else fail('Export format should be hidden/disabled by default');

    if (flavorContainer.classList.contains('hidden') && flavor.disabled) pass('Markdown flavor hidden/disabled by default');
    else fail('Markdown flavor should be hidden/disabled by default');

    if (!convertedThemeToggle.disabled) pass('Converted-page theme toggle enabled by default for HTML output');
    else fail('Converted-page theme toggle should be enabled by default for HTML output');

    if (convertedThemeOled.disabled) pass('OLED option disabled until converted-page theme toggle is enabled');
    else fail('OLED option should be disabled until converted-page theme toggle is enabled');

    experimental.checked = true;
    experimental.dispatchEvent(new Event('change', { bubbles: true }));

    if (!exportFormat.disabled && !exportFormat.classList.contains('hidden')) pass('Export format enabled when experimental is ON');
    else fail('Export format should be enabled when experimental is ON');

    exportFormat.value = 'markdown';
    exportFormat.dispatchEvent(new Event('change', { bubbles: true }));

    if (!flavorContainer.classList.contains('hidden') && !flavor.disabled) pass('Markdown flavor shown/enabled when Markdown format selected');
    else fail('Markdown flavor should be shown/enabled for Markdown format');

    if (convertedThemeToggle.disabled) pass('Converted-page theme toggle disabled for non-HTML export format');
    else fail('Converted-page theme toggle should be disabled for non-HTML export format');

    if (/available only for html/i.test(convertedThemeHelp.textContent || '')) pass('Converted-page theme toggle HTML-only help text shown for non-HTML formats');
    else fail('Expected converted-page theme HTML-only help text for non-HTML formats');

    exportFormat.value = 'html';
    exportFormat.dispatchEvent(new Event('change', { bubbles: true }));

    if (flavorContainer.classList.contains('hidden') && flavor.disabled) pass('Markdown flavor hidden/disabled for non-Markdown format');
    else fail('Markdown flavor should be hidden/disabled for non-Markdown format');

    experimental.checked = false;
    experimental.dispatchEvent(new Event('change', { bubbles: true }));

    const helpBeforeToggle = convertedThemeHelp.textContent || '';

    convertedThemeToggle.checked = true;
    convertedThemeToggle.dispatchEvent(new Event('change', { bubbles: true }));

    if (!convertedThemeOled.disabled) pass('OLED option enabled when converted-page theme toggle is checked');
    else fail('OLED option should be enabled when converted-page theme toggle is checked');

    convertedThemeOled.checked = true;
    convertedThemeOled.dispatchEvent(new Event('change', { bubbles: true }));
    const helpAfterToggle = convertedThemeHelp.textContent || '';
    if (helpBeforeToggle === helpAfterToggle) pass('Converted-page theme helper text remains stable when toggles are changed');
    else fail('Converted-page theme helper text should remain stable when toggles are changed');

    if (/choose html or markdown output/i.test(help.textContent || '')) pass('Homepage help text reflects HTML and Markdown experimental choices');
    else fail('Expected homepage help text to mention HTML and Markdown choices');

    const cfg = window.__getRuntime && window.__getRuntime().downloadHelpers.getConversionConfig();
    if (cfg && cfg.ExportFormat === 'html') pass('Export format falls back to HTML when experimental is OFF');
    else fail('Export format should fallback to HTML when experimental is OFF');

    if (cfg && cfg.ConvertedPageThemeToggleEnabled === true) pass('Converted-page theme toggle is passed in conversion config for HTML output');
    else fail('Converted-page theme toggle should be present in conversion config for HTML output');
  </script>
</body>
</html>
